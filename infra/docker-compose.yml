name: puntos-carga

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pc_dev_password
      POSTGRES_DB: puntos_carga
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pc -d puntos_carga']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
